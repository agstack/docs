# Overrides merged over config/_default/ when the environment is "development",
# which is what `hugo server` uses unless told otherwise. `hugo` (the production
# build, and what CI runs) defaults to "production" and never sees this file.
#
# The only reason this exists: the production baseURL is the live domain,
# https://docs.agstack.org/, and a Hugo server generates links against whatever
# baseURL it is handed. Without this override the local site would link to the
# deployed one.
baseURL = "http://localhost:1313/"
